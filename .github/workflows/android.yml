name: Build & Test Android App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Valid Gradle Wrapper
        run: gradle wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # -x kspDebugUnitTestKotlin ကို ထည့်ပေးထားသောကြောင့် KSP NullPointer Error ကို ကျော်သွားပါမည်
      - name: Run Unit Tests
        run: gradle test -x kspDebugUnitTestKotlin --no-daemon -Djava.awt.headless=true

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon -Djava.awt.headless=true
