name: Build & Test Android App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # -Djava.awt.headless=true ထည့်သွင်းထားခြင်းဖြင့် AWT NullPointerException ကို ဖြေရှင်းပေးပါသည်
      - name: Run Unit Tests
        run: ./gradlew test --no-daemon -Djava.awt.headless=true -Dorg.gradle.jvmargs="-Xmx2048m -Djava.awt.headless=true"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon -Djava.awt.headless=true
