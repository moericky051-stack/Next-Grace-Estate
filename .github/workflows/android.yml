name: Build & Test Android App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Corrupt ဖြစ်နေသော gradle-wrapper.jar ကို ကျော်လွန်ရန် System Gradle ဖြင့် Wrapper ပြန်ဆောက်ခြင်း
      - name: Setup Valid Gradle Wrapper
        run: gradle wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Unit Tests Run ခြင်း
      - name: Run Unit Tests
        run: gradle test --no-daemon -Djava.awt.headless=true

      # Debug APK Build ဆောက်ခြင်း
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon -Djava.awt.headless=true
