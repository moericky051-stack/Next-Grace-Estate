name: Build & Test Android App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Valid Gradle Wrapper
        run: gradle wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Project Root Folder ထဲတွင် debug.keystore ကို အလိုအလျောက် Generate လုပ်ပေးသည့် Step
      - name: Create Project-level Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      # Unit Tests Run ခြင်း
      - name: Run Unit Tests
        run: gradle test -x kspDebugUnitTestKotlin -x finalizeTestRoborazziDebug --no-daemon -Djava.awt.headless=true
        continue-on-error: true

      # Debug APK Build ဆောက်ခြင်း
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon -Djava.awt.headless=true

      # -----------------------------------------------------------------
      # 🚀 APK ကို Artifacts ထဲ ရောက်သွားအောင် Upload တင်ပေးမည့် Step
      # -----------------------------------------------------------------
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
