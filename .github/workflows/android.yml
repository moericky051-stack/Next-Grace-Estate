name: Build & Test Android App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # KSP Memory Issue နဲ့ NullPointer Exception မတက်စေရန် Memory ချိန်ညှိပြီး Unit Tests Run ခြင်း
      - name: Run Unit Tests
        run: ./gradlew test --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m"

      # Tests အားလုံး အောင်မြင်ပြီးပါက App ကို Build ဆောက်ခြင်း
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
